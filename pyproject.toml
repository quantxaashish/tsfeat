[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsfeat"
version = "0.1.0"
description = "Vectorised primitives for quantitative time-series research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aashish Bohra", email = "aashish.bohra93@gmail.com" }]
keywords = [
    "quantitative-finance",
    "time-series",
    "pandas",
    "numpy",
    "factor-research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26,<2.5", "pandas>=2.1,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pandas-stubs>=2.1",
    "yfinance>=0.2.40",
]

[project.urls]
Homepage = "https://github.com/quantxaashish/tsfeat"
Repository = "https://github.com/quantxaashish/tsfeat"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfeat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["tsfeat"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/tsfeat"]

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
